<!DOCTYPE html>
<!-- Declara que este arquivo usa HTML5 -->
<html lang="pt-BR">
<!-- Início do documento, idioma português do Brasil -->
<head>
  <!-- Cabeçalho: informações que não aparecem na tela -->
  <meta charset="UTF-8">
  <!-- Permite acentos e caracteres especiais -->
  <title>Mario - Caixas com Letras</title>
  <!-- Título que aparece na aba do navegador -->
  <link rel="stylesheet" href="style.css">
  <!-- Liga o arquivo de estilos (precisa estar na mesma pasta) -->
</head>
<body>
  <!-- Corpo da página: o que aparece na tela -->
  <canvas id="jogo" width="800" height="450"></canvas>
  <!-- A "tela de desenho" do jogo: 800 de largura, 450 de altura (pixels) -->
  <p class="ajuda">A = esquerda &nbsp;|&nbsp; D = direita &nbsp;|&nbsp; W = pular (bata nas caixas por baixo!)</p>
  <!-- Texto de ajuda com os controles -->
  <script src="script.js"></script>
  <!-- Carrega a lógica do jogo (fica por último para o canvas já existir) -->
</body>
</html>
